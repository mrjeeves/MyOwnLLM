[package]
name = "myownllm"
version = "0.2.35"
description = "MyOwnLLM — detect hardware, pick best local model, start it."
authors = []
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.88.0"

[[bin]]
name = "myownllm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
dirs = "5"
which = "6"
anyhow = "1"
# Local interprocess socket transport for the daemon control protocol —
# the LLM Tauri backend talks to `myownmesh serve` over the same
# line-delimited JSON socket the MyOwnMesh GUI uses. Unix-domain socket
# on Unix, namespaced pipe on Windows.
interprocess = { version = "2", features = ["tokio"] }
# Sync primitives for the Tauri daemon-state slot. parking_lot's Mutex
# is what the rest of the workspace uses (myownmesh-core ships it as a
# workspace dep); matching it here keeps the lockfile from picking up a
# second sync-primitives crate.
parking_lot = "0.12"
axum = { version = "0.7", features = ["macros", "ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
futures-util = "0.3"
bytes = "1"
dashmap = "6"
sha2 = "0.10"
hex = "0.4"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Cloud Mesh substrate. Identity, signing, and roster live in the
# `myownmesh-core` crate from the MyOwnMesh repo — the same code that
# was extracted out of this app's `mesh/` directory. We pin to a
# release tag, kept in sync with `.myownmesh-rev` (bump both when
# adopting a new MyOwnMesh release). The library is not on crates.io
# yet (gated on a public-API freeze), so git is the supported pin.
# `MYOWNMESH_HOME` is set to `~/.myownllm` in main.rs so the substrate
# reads/writes our existing on-disk layout (identity.json, rosters/)
# without surprising users with a path move.
myownmesh-core = { git = "https://github.com/mrjeeves/MyOwnMesh", tag = "v0.1.8" }

# base32 is still used directly by the Tauri command layer to decode
# `message_b32` arguments before handing the raw bytes to
# myownmesh-core's sign/verify. ed25519-dalek and rand_core, by
# contrast, are no longer needed here — the substrate owns key
# material and OS randomness behind its own API.
data-encoding = "2"

# Local transcription stack. ASR + diarization run as ONNX models via
# the `ort` crate (onnxruntime). Loading is `load-dynamic` so the
# onnxruntime dylib is resolved at runtime rather than statically
# linked — keeps the build matrix simple, avoids ~100 MB of static-link
# bloat per platform, and lets users disable ML features by removing
# the runtime file. The dylib itself is delivered by `scripts/install.sh`
# / `scripts/install.ps1` at install time, with an in-process first-run
# fallback in `src/ort_install.rs` that downloads into
# `~/.myownllm/runtime/` for users who installed via the Tauri
# `.msi`/`.dmg`/`.deb` bundles directly.
#
# cpal handles cross-platform audio capture (CoreAudio / WASAPI / ALSA on
# macOS / Windows / Linux). All audio + ASR + diarization work runs
# in-process; nothing is sent over the network at runtime.
#
# Per-tier model selection lives in `manifests/default.json`:
#   - Pi 5 / low-end:                 Moonshine Small (English, 123 MB).
#   - 16+ GB Apple Silicon, x86:      Parakeet TDT 0.6B v3 (25 langs).
#   - Diarization on all tiers:       pyannote-segmentation-3.0 + a
#                                     speaker embedder + online clustering.
cpal = "0.15"
crossbeam-channel = "0.5"
ort = { version = "=2.0.0-rc.12", default-features = false, features = ["std", "load-dynamic", "ndarray", "api-22"] }
# Pinned to 0.17 to match what ort 2.0.0-rc.12 depends on. Mixing
# 0.16 and 0.17 compiles them as distinct types so trait impls (like
# OwnedTensorArrayData) don't line up between our arrays and ort's
# tensor constructors — the failure mode is a confusing "trait not
# satisfied" error that suggests the same type as the one you have.
ndarray = "0.17"
# HuggingFace `tokenizers` for Moonshine's BPE tokenizer (ships a
# tokenizer.json). The `unstable_wasm` feature name is misleading — what
# it actually does is swap Oniguruma (a C regex library that needs cmake
# + perl on Windows and has periodic Windows build flakes) for
# `fancy-regex`, a pure-Rust regex engine that works everywhere. Despite
# the feature name, it's safe on native targets too; the `getrandom/js`
# bit it pulls in is gated to wasm32 builds. Parakeet uses a simple
# SentencePiece-style `tokens.txt` we parse ourselves so it doesn't
# touch this.
tokenizers = { version = "0.20", default-features = false, features = ["unstable_wasm"] }
# Audio file decoding for the "Upload audio" flow (and the HTTP transcription
# route). symphonia is pure Rust (no extra system deps). NB: in symphonia the
# container *format* and the sample *codec* are separate features — `wav` is
# only the RIFF demuxer; decoding PCM samples needs `pcm` (and `adpcm` for the
# compressed WAV variants). Without them a plain 16-bit PCM WAV — the most
# common WAV, and exactly what the mic/transcription path produces — probes
# fine but fails at `get_codecs().make()` with "unsupported codec".
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "adpcm", "flac", "mp3", "aac", "isomp4", "ogg", "vorbis"] }
# Real-input FFT for the diarize embedder's kaldi-compatible 80-dim
# fbank front-end. wespeaker-r34 and CAM++ both consume `[B, T, 80]`
# log-mel filterbank features rather than raw audio (the ONNX exports
# don't bake the spectrogram in despite past comments to the contrary);
# `realfft` is half the work of a generic complex FFT for our real
# 512-point frames and keeps the dep surface narrow.
realfft = "3"
# Archive extraction for the first-run onnxruntime fetcher (`ort_install`).
# Microsoft ships onnxruntime as `.tgz` for macOS/Linux and `.zip` for
# Windows, so we need both. `zip` is the only widely-used pure-Rust zip
# reader; `flate2` + `tar` are the standard pair for `.tar.gz`. All three
# are popular, audited crates with minimal transitive deps.
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"

# WebKitGTK Rust bindings — Linux only. Tauri / wry already pulls this
# in transitively (the WebView is a `webkit2gtk::WebView` under the
# hood), but we depend on it explicitly so we can flip `enable-webrtc`
# on the WebKitSettings at startup. WebKitGTK 2.38+ ships WebRTC
# support but leaves it off by default — without this opt-in,
# `window.RTCPeerConnection` is undefined and Trystero's `joinRoom`
# errors with "Can't find variable: RTCPeerConnection". Pinned to the
# same major as the version wry resolves so the type passed to
# `with_webview(...)` lines up. macOS WKWebView and Windows WebView2
# both expose RTCPeerConnection out of the box, so no equivalent
# fixup is needed there.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2"

[dev-dependencies]
# Filesystem fixtures for migration tests. `tempdir()` + scoped
# cleanup so a failed test doesn't leak directories under the
# user's actual home.
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
